<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Prova l'orologio</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:#101418; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:#fff; }
  #stage { position:fixed; inset:0; touch-action:none; overflow:hidden; }
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#1b222b; }
  #cam.mirror { transform:scaleX(-1); }
  #watch { position:absolute; left:0; top:0; width:466px; height:648px; transform-origin:224px 324px;
    pointer-events:none; will-change:transform,opacity; transition:opacity .25s;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.45)); }
  #watch.lost { opacity:.55; }

  .top { position:fixed; left:0; right:0; top:0; z-index:5; display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0; pointer-events:none; }
  #msg { background:rgba(10,20,35,.72); padding:9px 14px; border-radius:14px; font-size:14px; line-height:1.35; max-width:72vw;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); transition:opacity .35s; }
  #msg.hide { opacity:0; }
  .round { pointer-events:auto; width:46px; height:46px; border-radius:50%; border:0; background:rgba(10,20,35,.72); color:#fff;
    font-size:20px; display:flex; align-items:center; justify-content:center;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .round:active { transform:scale(.92); }
  .bottom { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; justify-content:center; gap:10px;
    padding:0 12px calc(env(safe-area-inset-bottom,0px) + 14px); }
  .pill { border:0; border-radius:999px; padding:12px 18px; font-size:15px; font-weight:600; background:rgba(255,255,255,.92); color:#10243f; }
  .pill:active { transform:scale(.96); }

  #start { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    padding:28px; text-align:center; background:#0f1a2b; }
  #start p { margin:0; font-size:17px; line-height:1.5; max-width:340px; }
  #start button { border:0; border-radius:999px; padding:14px 24px; font-size:17px; font-weight:700; background:#fff; color:#10243f; }
</style>
</head>

  <button class="pill" id="reset" type="button">Reimposta</button>
</div>

<div id="start">
  <p id="startText">Per provare l'orologio al polso serve la fotocamera.</p>
  <button id="startBtn" type="button">Attiva la fotocamera</button>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";

const SPR = { w:466, h:648, cx:224, cy:324, caseW:428 };
const $ = id => document.getElementById(id);
const video = $('cam'), watchEl = $('watch'), msg = $('msg'), stage = $('stage');

let facing = 'environment', stream = null, landmarker = null, running = false;
let lastVideoTime = -1, lastSeen = 0, tracked = false, msgTimer = 0;

/* ---------- posa dell'orologio ---------- */
// base = posa seguita dalla mano; adj = correzioni manuali (nel sistema di riferimento della mano)
const base = { x: innerWidth/2, y: innerHeight/2, a: 0, w: Math.min(innerWidth, innerHeight)*0.42 };
const adj  = { dx:0, dy:0, ds:1, da:0 };
const smooth = { x:null, y:null, c:1, s:0, w:null };

function say(t, keep) {
  msg.textContent = t; msg.classList.remove('hide'); clearTimeout(msgTimer);
  if (!keep) msgTimer = setTimeout(() => msg.classList.add('hide'), 3500);
}

function render() {
  const w = base.w * adj.ds;
  const s = w / SPR.caseW;
  const a = base.a + adj.da;
  // spostamento manuale espresso in "larghezze di cassa" ruotate con la mano
  const ox = (adj.dx * Math.cos(base.a) - adj.dy * Math.sin(base.a)) * base.w;
  const oy = (adj.dx * Math.sin(base.a) + adj.dy * Math.cos(base.a)) * base.w;
  const x = base.x + ox, y = base.y + oy;
  watchEl.style.transform =
    `translate(${(x - SPR.cx).toFixed(1)}px,${(y - SPR.cy).toFixed(1)}px) rotate(${a.toFixed(4)}rad) scale(${s.toFixed(4)})`;
}

/* da coordinate normalizzate del video a pixel dello schermo (object-fit: cover, specchio se frontale) */
function toScreen(p) {
  const vw = video.videoWidth, vh = video.videoHeight, W = innerWidth, H = innerHeight;
  const k = Math.max(W / vw, H / vh);
  const ox = (W - vw * k) / 2, oy = (H - vh * k) / 2;
  let x = p.x * vw * k + ox;
  const y = p.y * vh * k + oy;
  if (facing === 'user') x = W - x;
  return { x, y };
}

/* calcola la posa dai punti della mano (0 polso, 5 e 17 base di indice e mignolo, 9 base del medio) */
function poseFromHand(lm) {
  const P = i => toScreen(lm[i]);
  const wr = P(0), mid = P(9), idx = P(5), pk = P(17);
  let dx = mid.x - wr.x, dy = mid.y - wr.y;
  const u = Math.hypot(dx, dy) || 1;
  dx /= u; dy /= u;                                   // versante verso le dita = "12 sull'orologio"
  const palmW = Math.hypot(idx.x - pk.x, idx.y - pk.y);
  return {
    x: wr.x - dx * u * 0.22,                          // un po' verso l'avambraccio
    y: wr.y - dy * u * 0.22,
    a: Math.atan2(dx, -dy),                           // angolo rispetto alla verticale
    w: Math.max(palmW * 0.95, u * 0.8)
  };
}

function applyPose(p) {
  const first = smooth.x === null;
  const kp = first ? 1 : 0.4, ks = first ? 1 : 0.25, ka = first ? 1 : 0.35;
  smooth.x = first ? p.x : smooth.x + (p.x - smooth.x) * kp;
  smooth.y = first ? p.y : smooth.y + (p.y - smooth.y) * kp;
  smooth.w = first ? p.w : smooth.w + (p.w - smooth.w) * ks;
  // media dell'angolo con seno/coseno per evitare salti a ±180°
  const sn = Math.sin(p.a), cs = Math.cos(p.a);
  smooth.s = first ? sn : smooth.s + (sn - smooth.s) * ka;
  smooth.c = first ? cs : smooth.c + (cs - smooth.c) * ka;
  base.x = smooth.x; base.y = smooth.y; base.w = smooth.w; base.a = Math.atan2(smooth.s, smooth.c);
}
window.__applyPose = (p) => { applyPose(p); render(); };   // utile per i test
window.__poseFromHand = poseFromHand;

/* ---------- ciclo di rilevamento ---------- */
function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  let res;
  try { res = landmarker.detectForVideo(video, performance.now()); } catch (e) { return; }
  const now = performance.now();
  if (res && res.landmarks && res.landmarks.length) {
    lastSeen = now;
    if (!tracked) { tracked = true; watchEl.classList.remove('lost'); say('Polso agganciato. Trascina o pizzica per regolare.'); }
    applyPose(poseFromHand(res.landmarks[0]));
    render();
  } else if (tracked && now - lastSeen > 700) {
    tracked = false; watchEl.classList.add('lost'); say('Mostra la mano con il dorso verso la fotocamera', true);
  }
}

/* ---------- fotocamera ---------- */
async function startCamera() {
  stopCamera();
  $('start').style.display = 'none';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) {
    $('startText').textContent = 'Non riesco ad accedere alla fotocamera. Consenti l\'accesso nelle impostazioni del browser e riprova.';
    $('startBtn').textContent = 'Riprova';
    $('start').style.display = 'flex';
    return;
  }
  video.srcObject = stream;
  video.classList.toggle('mirror', facing === 'user');
  try { await video.play(); } catch (e) { $('start').style.display = 'flex'; return; }
  smooth.x = null; tracked = false; lastVideoTime = -1;
  watchEl.classList.add('lost');
  say(landmarker ? 'Inquadra il polso con il dorso della mano verso la fotocamera' : 'Carico il riconoscimento della mano…', true);
  if (!running) { running = true; requestAnimationFrame(loop); }
}
function stopCamera() {
  running = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

async function loadModel() {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
  const opts = delegate => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 1,
    minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
  });
  try { landmarker = await HandLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch (e) { landmarker = await HandLandmarker.createFromOptions(fileset, opts("CPU")); }
  if (!tracked) say('Inquadra il polso con il dorso della mano verso la fotocamera', true);
}

/* ---------- gesti: 1 dito sposta, 2 dita ingrandiscono e ruotano ---------- */
const touches = new Map();
let g = null;
function pts() { return [...touches.values()]; }
function startGesture() {
  const p = pts();
  if (p.length === 1) g = { m:'move', x:p[0].x, y:p[0].y, dx:adj.dx, dy:adj.dy };
  else if (p.length >= 2) {
    g = { m:'pinch', d:Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y), r:Math.atan2(p[1].y-p[0].y, p[1].x-p[0].x), ds:adj.ds, da:adj.da };
  } else g = null;
}
stage.addEventListener('pointerdown', e => { touches.set(e.pointerId, {x:e.clientX, y:e.clientY}); stage.setPointerCapture(e.pointerId); startGesture(); });
stage.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const p = pts();
  if (g && g.m === 'move' && p.length === 1) {
    // trasforma lo spostamento dello schermo nel sistema della mano
    const sx = p[0].x - g.x, sy = p[0].y - g.y;
    const c = Math.cos(-base.a), s = Math.sin(-base.a), w = base.w * adj.ds || 1;
    adj.dx = g.dx + (sx * c - sy * s) / base.w;
    adj.dy = g.dy + (sx * s + sy * c) / base.w;
  } else if (g && g.m === 'pinch' && p.length >= 2) {
    const d = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y), r = Math.atan2(p[1].y-p[0].y, p[1].x-p[0].x);
    adj.ds = Math.min(3, Math.max(0.3, g.ds * d / g.d));
    adj.da = g.da + (r - g.r);
  }
  render();
});
const up = e => { touches.delete(e.pointerId); startGesture(); };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
document.addEventListener('gesturestart', e => e.preventDefault());   // niente zoom della pagina su iOS

$('reset').addEventListener('click', () => { adj.dx = 0; adj.dy = 0; adj.ds = 1; adj.da = 0; render(); say('Posizione ripristinata'); });
$('flip').addEventListener('click', () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); });
$('startBtn').addEventListener('click', startCamera);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); else startCamera(); });
addEventListener('pagehide', stopCamera);
addEventListener('resize', render);

render();
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  $('startText').textContent = 'Questo browser non permette di usare la fotocamera. Apri il link con Safari (iPhone) o Chrome (Android).';
  $('startBtn').style.display = 'none'; $('start').style.display = 'flex';
} else {
  startCamera();
  loadModel().catch(() => say('Non riesco a caricare il riconoscimento della mano. Controlla la connessione. Puoi comunque posizionare l\'orologio a mano.', true));
}
</script>
</body>
</html>
