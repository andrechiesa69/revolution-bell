<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Prova l'orologio</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:#101418; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:#fff; }
  #stage { position:fixed; inset:0; touch-action:none; overflow:hidden; }
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#1b222b; }
  #cam.mirror { transform:scaleX(-1); }
  #dbg { position:absolute; pointer-events:none; opacity:.5; image-rendering:pixelated; display:none; }
  #guide { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #watch { position:absolute; left:0; top:0; width:466px; height:578px; transform-origin:224px 248px;
    pointer-events:none; will-change:transform,opacity; transition:opacity .35s;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.45)); }
  #watch.lost { opacity:.55; }
  #watch.hidden { opacity:0; }

  .top { position:fixed; left:0; right:0; top:0; z-index:5; display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0; pointer-events:none; }
  #msg { background:rgba(10,20,35,.74); padding:9px 14px; border-radius:14px; font-size:14px; line-height:1.35; max-width:66vw;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); transition:opacity .35s; }
  #msg.hide { opacity:0; }
  .btns { display:flex; gap:8px; }
  .round { pointer-events:auto; width:44px; height:44px; border-radius:50%; border:0; background:rgba(10,20,35,.74); color:#fff;
    font-size:19px; display:flex; align-items:center; justify-content:center;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .round:active { transform:scale(.92); }
  .round.on { background:#2e7dd7; }
  .bottom { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
    padding:0 10px calc(env(safe-area-inset-bottom,0px) + 12px); }
  .pill { border:0; border-radius:999px; padding:11px 15px; font-size:14px; font-weight:600; background:rgba(255,255,255,.92); color:#10243f; }
  .pill:active { transform:scale(.96); }

  #start { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    padding:28px; text-align:center; background:#0f1a2b; }
  #start p { margin:0; font-size:17px; line-height:1.5; max-width:340px; }
  #start button { border:0; border-radius:999px; padding:14px 24px; font-size:17px; font-weight:700; background:#fff; color:#10243f; }
</style>
</head>

    `<line x1="${x0 - 16}" y1="${g.wristY}" x2="${x1 + 16}" y2="${g.wristY}" stroke="#7fd1ff" stroke-width="3"/>` +
    `<circle cx="${g.cx}" cy="${g.wristY}" r="26" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="6"/>` +
    `<circle id="ringp" cx="${g.cx}" cy="${g.wristY}" r="26" fill="none" stroke="#7fd1ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C_RING}" stroke-dashoffset="${C_RING}" transform="rotate(-90 ${g.cx} ${g.wristY})"/>` +
    txt(g.cx, g.wristY - 38, 'polso') + txt(g.cx, g.top - 10, 'mano');
}
function setProgress(f) {
  const el = guideEl.querySelector('#ringp'); if (el) el.setAttribute('stroke-dashoffset', (C_RING * (1 - Math.min(1, f))).toFixed(1));
}
function guideRectLow() {
  const g = guideGeom();
  const a = screenToLow(g.cx - g.gw * 0.28, g.wristY - innerHeight * 0.07), b = screenToLow(g.cx + g.gw * 0.28, g.wristY + innerHeight * 0.17);
  return { x0: Math.min(a.x, b.x), y0: Math.min(a.y, b.y), x1: Math.max(a.x, b.x), y1: Math.max(a.y, b.y) };
}
function startMapping() {
  mode = 'guide'; hooked = false; handVisible = false; skin = null; patches = []; skinLost = 0;
  calib.n = 0; calib.last = null; calib.since = performance.now(); calib.warned = false;
  tilt.r = 0; tilt.p = 0; smooth.x = null; smooth.r = 0; smooth.p = 0;
  watchEl.classList.add('hidden'); watchEl.classList.remove('lost');
  guideEl.style.display = 'block'; drawGuide(); setProgress(0);
  say(`Appoggia l'avambraccio nella sagoma, con il polso sul cerchio, e tieni fermo`, true);
}
function stepCalibration(img) {
  const r = guideRectLow(), st = regionStats(img, r.x0, r.y0, r.x1, r.y1);
  if (plausible(st)) { calib.n++; calib.last = st; } else calib.n = Math.max(0, calib.n - 2);
  setProgress(calib.n / CALIB_FRAMES);
  if (calib.n >= CALIB_FRAMES) finishMapping(img);
  else if (!calib.warned && performance.now() - calib.since > 7000) {
    calib.warned = true; say(`Non riconosco la pelle nella sagoma: serve il polso nudo, più luce e uno sfondo diverso dalla pelle`, true);
  }
}
function enterTracking(img) {
  mode = 'tracking'; hooked = true; guideEl.style.display = 'none';
  watchEl.classList.remove('hidden', 'lost');
  anchorPatches(img);
}
function finishMapping(img) {
  const g = guideGeom();
  skin = buildModel(calib.last);
  adj.dx = 0; adj.dy = 0; adj.ds = 1; adj.da = 0;
  base.x = g.cx; base.y = g.wristY; base.a = 0; base.w = g.gw * 0.78;
  const s = crossSection(img, g.cx, g.wristY, 0);
  if (s && s.l + s.r > 10) { base.x += (s.r - s.l) / 2; base.w = (s.l + s.r) * 0.78; }
  clampBase(); smooth.x = null; render();
  enterTracking(img);
  say(`Polso mappato. L'orologio resta agganciato: muovi il braccio per provarlo`);
}

/* ================= ciclo principale ================= */
function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  if (video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const now = performance.now();
  let hand = null;
  if (landmarker) { try { const res = landmarker.detectForVideo(video, now); if (res && res.landmarks && res.landmarks.length) hand = res.landmarks[0]; } catch (e) {} }
  const img = grabFrame(); if (!img) return;

  if (hand) {
    lastSeen = now;
    if (!hooked) {                                   // mano riconosciuta: mappatura automatica, senza sagoma
      const p = poseFromHand(hand), c = screenToLow(p.x, p.y), h = Math.max(3, p.w * lowPerScreen() * 0.22);
      const st = regionStats(img, c.x - h, c.y - h, c.x + h, c.y + h);
      skin = (plausible(st) ? buildModel(st) : null);
      smooth.x = null; applyPose(p); render(); enterTracking(img);
    }
    if (!handVisible) { handVisible = true; say(`Mano riconosciuta. Se la allontani, l'orologio resta sul polso.`); }
    if (!frozen) { applyPose(poseFromHand(hand)); render(); anchorPatches(img); }
  } else if (mode === 'guide') {
    stepCalibration(img);
  } else if (hooked) {
    if (handVisible && now - lastSeen > 400) { handVisible = false; say(frozen ? `Orologio fissato` : `Mano fuori: l'orologio segue il polso. "Fissa" lo blocca.`); }
    if (!handVisible && !frozen) trackWrist(img);
  }
  if (debugOn) drawDebug(img);
}

/* ================= vista di controllo: mostra la pelle riconosciuta ================= */
function drawDebug(img) {
  if (!skin) { dbgCanvas.style.display = 'none'; return; }
  const m = metrics();
  if (dbgCanvas.width !== img.w || dbgCanvas.height !== img.h) { dbgCanvas.width = img.w; dbgCanvas.height = img.h; }
  const ctx = dbgCanvas.getContext('2d'), id = ctx.createImageData(img.w, img.h), d = id.data;
  for (let y = 0; y < img.h; y++) for (let x = 0; x < img.w; x++) if (isSkinAt(img, x, y)) { const j = (y * img.w + x) * 4; d[j + 1] = 255; d[j + 3] = 255; }
  ctx.putImageData(id, 0, 0);
  const s = dbgCanvas.style;
  s.display = 'block'; s.left = m.ox + 'px'; s.top = m.oy + 'px'; s.width = m.vw * m.k + 'px'; s.height = m.vh * m.k + 'px';
  s.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
}

/* ================= fotocamera e modello della mano ================= */
async function startCamera() {
  stopCamera();
  $('start').style.display = 'none';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) {
    $('startText').textContent = `Non riesco ad accedere alla fotocamera. Consenti l'accesso nelle impostazioni del browser e riprova.`;
    $('startBtn').textContent = 'Riprova'; $('start').style.display = 'flex'; return;
  }
  video.srcObject = stream;
  video.classList.toggle('mirror', facing === 'user');
  try { await video.play(); } catch (e) { $('start').style.display = 'flex'; return; }
  lastVideoTime = -1;
  startMapping();
  if (!running) { running = true; requestAnimationFrame(loop); }
}
function stopCamera() { running = false; if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

async function loadModel() {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
  const opts = delegate => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 1, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
  });
  try { landmarker = await HandLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch (e) { landmarker = await HandLandmarker.createFromOptions(fileset, opts("CPU")); }
}

/* ================= gesti: 1 dito sposta, 2 dita ingrandiscono e ruotano ================= */
const touches = new Map(); let gst = null;
const pts = () => [...touches.values()];
function startGesture() {
  const p = pts();
  if (p.length === 1) gst = { m: 'move', x: p[0].x, y: p[0].y, dx: adj.dx, dy: adj.dy };
  else if (p.length >= 2) gst = { m: 'pinch', d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), r: Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x), ds: adj.ds, da: adj.da };
  else gst = null;
}
stage.addEventListener('pointerdown', e => { touches.set(e.pointerId, { x: e.clientX, y: e.clientY }); stage.setPointerCapture(e.pointerId); startGesture(); });
stage.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId) || mode !== 'tracking') return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const p = pts();
  if (gst && gst.m === 'move' && p.length === 1) {
    const sx = p[0].x - gst.x, sy = p[0].y - gst.y, c = Math.cos(-base.a), s = Math.sin(-base.a);
    adj.dx = gst.dx + (sx * c - sy * s) / base.w; adj.dy = gst.dy + (sx * s + sy * c) / base.w;
  } else if (gst && gst.m === 'pinch' && p.length >= 2) {
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), r = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x);
    adj.ds = Math.min(3, Math.max(0.3, gst.ds * d / gst.d)); adj.da = gst.da + (r - gst.r);
  }
  render();
});
const up = e => { touches.delete(e.pointerId); startGesture(); };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
document.addEventListener('gesturestart', e => e.preventDefault());

$('reset').addEventListener('click', () => { adj.dx = 0; adj.dy = 0; adj.ds = 1; adj.da = 0; render(); say('Posizione ripristinata'); });
$('remap').addEventListener('click', () => startMapping());
$('freeze').addEventListener('click', () => {
  frozen = !frozen; $('freeze').textContent = frozen ? 'Sblocca' : 'Fissa';
  say(frozen ? `Orologio fissato: non si muove più da solo` : `L'orologio torna a seguire il polso`);
});
$('dbgBtn').addEventListener('click', () => {
  debugOn = !debugOn; $('dbgBtn').classList.toggle('on', debugOn);
  if (!debugOn) dbgCanvas.style.display = 'none';
  say(debugOn ? `In verde la pelle riconosciuta: se non copre il polso, cambia luce o sfondo` : `Vista di controllo spenta`);
});
$('flip').addEventListener('click', () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); });
$('startBtn').addEventListener('click', startCamera);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); else startCamera(); });
addEventListener('pagehide', stopCamera);
addEventListener('resize', () => { if (mode === 'guide') drawGuide(); else render(); });

/* solo per i test */
window.__t = { base, adj, tilt, render, screenToLow, lowToScreen, lowPerScreen, regionStats, buildModel, plausible, crossSection, refineWithSkin,
  poseFromHand, applyPose, bestShift, cutPatch, anchorPatches, followPatches, grabFrame, isSkinAt,
  stepCalibration, trackWrist, setSkin: m => { skin = m; }, getSkin: () => skin, setFacing: f => { facing = f; }, get mode() { return mode; } };

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  $('startText').textContent = 'Questo browser non permette di usare la fotocamera. Apri il link con Safari (iPhone) o Chrome (Android).';
  $('startBtn').style.display = 'none'; $('start').style.display = 'flex';
} else {
  startCamera();
  loadModel().catch(() => {});   // senza il riconoscimento della mano la mappatura guidata funziona comunque
}
</script>
</body>
</html>
