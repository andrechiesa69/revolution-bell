<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Prova l'orologio</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:#101418; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:#fff; }
  #stage { position:fixed; inset:0; touch-action:none; overflow:hidden; }
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#1b222b; }
  #cam.mirror { transform:scaleX(-1); }
  #dbg { position:absolute; pointer-events:none; opacity:.5; image-rendering:pixelated; display:none; }
  #guide { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #watch { position:absolute; left:0; top:0; width:363px; height:621px; transform-origin:182px 312px;
    pointer-events:none; will-change:transform,opacity; transition:opacity .35s;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.45)); }
  #watch.lost { opacity:.55; }
  #watch.hidden { opacity:0; }

  .top { position:fixed; left:0; right:0; top:0; z-index:5; display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0; pointer-events:none; }
  #msg { background:rgba(10,20,35,.74); padding:9px 14px; border-radius:14px; font-size:14px; line-height:1.35; max-width:66vw;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); transition:opacity .35s; }
  #msg.hide { opacity:0; }
  .btns { display:flex; gap:8px; }
  .round { pointer-events:auto; width:44px; height:44px; border-radius:50%; border:0; background:rgba(10,20,35,.74); color:#fff;
    font-size:19px; display:flex; align-items:center; justify-content:center;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .round:active { transform:scale(.92); }
  .round.on { background:#2e7dd7; }
  .bottom { position:fixed; right:0; bottom:0; z-index:5; display:flex; flex-direction:column; align-items:flex-end; gap:12px;
    padding:0 14px calc(env(safe-area-inset-bottom,0px) + 18px) 0; pointer-events:none; }
  .bottom .pill { pointer-events:auto; box-shadow:0 2px 10px rgba(0,0,0,.35); }
  .row { display:flex; justify-content:center; gap:8px; }
  .pill { border:0; border-radius:999px; padding:13px 20px; font-size:15px; font-weight:600; background:rgba(255,255,255,.92); color:#10243f; }
  .pill:active { transform:scale(.96); }

  #start { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    padding:28px; text-align:center; background:#0f1a2b; }
  #start p { margin:0; font-size:17px; line-height:1.5; max-width:340px; }
  #start button { border:0; border-radius:999px; padding:14px 24px; font-size:17px; font-weight:700; background:#fff; color:#10243f; }
</style>
</head>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";

const SPR = { w:363, h:621, cx:182, cy:312, caseW:265 };
const $ = id => document.getElementById(id);
const video = $('cam'), watchEl = $('watch'), msg = $('msg'), stage = $('stage'), guideEl = $('guide'), dbgCanvas = $('dbg');

let facing = 'environment', stream = null, landmarker = null, running = false;
let lastVideoTime = -1, lastSeen = 0, msgTimer = 0;
let mode = 'guide';          // 'guide' = mappatura del polso in corso, 'tracking' = orologio agganciato
let hooked = false, handVisible = false, frozen = false, debugOn = false;
let skin = null;             // modello del colore della pelle
let skinLost = 0, flipped = 0, armHalf = 0.78;   // flipped: 1 = orologio girato di 180 gradi; armHalf: meta' larghezza del braccio in larghezze di cassa

/* ================= posa dell'orologio ================= */
const base = { x: innerWidth / 2, y: innerHeight / 2, a: 0, w: Math.min(innerWidth, innerHeight) * 0.3 };

const smooth = { x: null, y: null, c: 1, s: 0, w: null, r: 0, p: 0 };
const tilt = { r: 0, p: 0 };                                       // inclinazione 3D (solo quando si vede la mano)
const MAXR = 0.95, MAXP = 0.65;

function say(t, keep) {
  msg.textContent = t; msg.classList.remove('hide'); clearTimeout(msgTimer);
  if (!keep) msgTimer = setTimeout(() => msg.classList.add('hide'), 3500);

  const palmW = Math.hypot(idx.x - pk.x, idx.y - pk.y);
  const w = Math.max(palmW * 0.58, u * 0.42);                   // larghezza della cassa
  const back = w * 0.42 + u * 0.12;                              // quanto sta indietro rispetto al polso
  const a = Math.atan2(dx, -dy);
  const m = metrics(), asp = m.vh / m.vw;
  const nlen = (i, j) => Math.hypot(lm[i].x - lm[j].x, (lm[i].y - lm[j].y) * asp);
  const xl = { x: Math.cos(a), y: Math.sin(a) };
  const sgn = ((pk.x - idx.x) * xl.x + (pk.y - idx.y) * xl.y) >= 0 ? 1 : -1;
  let r = Math.atan2((lm[17].z - lm[5].z) * sgn, nlen(5, 17) || 1e-3);
  let p = Math.atan2(lm[9].z - lm[0].z, nlen(0, 9) || 1e-3);
  r = Math.max(-MAXR, Math.min(MAXR, r * 0.8)); p = Math.max(-MAXP, Math.min(MAXP, p * 0.6));
  return { x: wr.x - dx * back, y: wr.y - dy * back, a, w, r, p };
}
function applyPose(p) {
  const first = smooth.x === null;
  const kp = first ? 1 : 0.4, ks = first ? 1 : 0.25, ka = first ? 1 : 0.35, kt = first ? 1 : 0.15;
  smooth.x = first ? p.x : smooth.x + (p.x - smooth.x) * kp;
  smooth.y = first ? p.y : smooth.y + (p.y - smooth.y) * kp;
  smooth.w = first ? p.w : smooth.w + (p.w - smooth.w) * ks;
  const sn = Math.sin(p.a), cs = Math.cos(p.a);
  smooth.s = first ? sn : smooth.s + (sn - smooth.s) * ka;
  smooth.c = first ? cs : smooth.c + (cs - smooth.c) * ka;
  base.x = smooth.x; base.y = smooth.y; base.w = smooth.w; base.a = Math.atan2(smooth.s, smooth.c);
  smooth.r += ((p.r || 0) - smooth.r) * kt; smooth.p += ((p.p || 0) - smooth.p) * kt;
  tilt.r = smooth.r; tilt.p = smooth.p;
}

/* ================= mappatura guidata del polso ================= */
const CALIB_FRAMES = 18;
const calib = { n: 0, last: null, since: 0, warned: false };
const C_RING = 2 * Math.PI * 26;
function guideGeom() {
  const W = innerWidth, H = innerHeight;
  return { cx: W / 2, gw: Math.min(W * 0.40, H * 0.26), wristY: H * 0.58, top: H * 0.30 };
}
function drawGuide() {
  const g = guideGeom(), W = innerWidth, H = innerHeight, x0 = g.cx - g.gw / 2, x1 = g.cx + g.gw / 2, r = g.gw / 2;
  guideEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const txt = (x, y, t) => `<text x="${x}" y="${y}" font-size="15" font-weight="600" fill="#fff" stroke="rgba(0,0,0,.55)" stroke-width="3" paint-order="stroke" text-anchor="middle">${t}</text>`;
  guideEl.innerHTML =
    `<path d="M ${x0} ${H + 10} L ${x0} ${g.top + r} A ${r} ${r} 0 0 1 ${x1} ${g.top + r} L ${x1} ${H + 10}" fill="rgba(255,255,255,.07)" stroke="#fff" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>` +
    `<line x1="${x0 - 16}" y1="${g.wristY}" x2="${x1 + 16}" y2="${g.wristY}" stroke="#7fd1ff" stroke-width="3"/>` +
    `<circle cx="${g.cx}" cy="${g.wristY}" r="26" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="6"/>` +
    `<circle id="ringp" cx="${g.cx}" cy="${g.wristY}" r="26" fill="none" stroke="#7fd1ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C_RING}" stroke-dashoffset="${C_RING}" transform="rotate(-90 ${g.cx} ${g.wristY})"/>` +
    txt(g.cx, g.wristY - 38, 'polso') + txt(g.cx, g.top - 10, 'mano');
}
function setProgress(f) {
  const el = guideEl.querySelector('#ringp'); if (el) el.setAttribute('stroke-dashoffset', (C_RING * (1 - Math.min(1, f))).toFixed(1));
}
function guideRectLow() {
  const g = guideGeom();
  const a = screenToLow(g.cx - g.gw * 0.28, g.wristY - innerHeight * 0.07), b = screenToLow(g.cx + g.gw * 0.28, g.wristY + innerHeight * 0.17);
  return { x0: Math.min(a.x, b.x), y0: Math.min(a.y, b.y), x1: Math.max(a.x, b.x), y1: Math.max(a.y, b.y) };
}
function startMapping() {
  mode = 'guide'; hooked = false; handVisible = false; skin = null; skinLost = 0; tracker.reset(); trackFail = 0; lostNote = false; armHalf = 0.78; applyMask();
  calib.n = 0; calib.last = null; calib.since = performance.now(); calib.warned = false;
  tilt.r = 0; tilt.p = 0; smooth.x = null; smooth.r = 0; smooth.p = 0;
  watchEl.classList.add('hidden'); watchEl.classList.remove('lost');
  guideEl.style.display = 'block'; drawGuide(); setProgress(0);
  say(`Appoggia l'avambraccio nella sagoma, con il polso sul cerchio, e tieni fermo`, true);
}
function stepCalibration(img) {
  const r = guideRectLow(), st = regionStats(img, r.x0, r.y0, r.x1, r.y1);
  if (plausible(st)) { calib.n++; calib.last = st; } else calib.n = Math.max(0, calib.n - 2);
  setProgress(calib.n / CALIB_FRAMES);
  if (calib.n >= CALIB_FRAMES) finishMapping(img);
  else if (!calib.warned && performance.now() - calib.since > 7000) {
    calib.warned = true; say(`Non riconosco la pelle nella sagoma: serve il polso nudo, più luce e uno sfondo diverso dalla pelle`, true);
  }
}
function enterTracking(img) {
  mode = 'tracking'; hooked = true; guideEl.style.display = 'none';
  watchEl.classList.remove('hidden', 'lost');
  tracker.reset(); trackFail = 0; pyr = null;
}
/* direzione dell'avambraccio: asse principale dei pixel di pelle attorno al polso (la sagoma suppone il braccio in verticale, ma chi tiene il telefono lo inclina) */
function armAxis(img, cx, cy, R) {
  let n = 0, mx = 0, my = 0;
  const pts = [];
  for (let y = Math.max(0, Math.floor(cy - R)); y <= Math.min(img.h - 1, Math.ceil(cy + R)); y += 2)
    for (let x = Math.max(0, Math.floor(cx - R)); x <= Math.min(img.w - 1, Math.ceil(cx + R)); x += 2) {
      if ((x - cx) * (x - cx) + (y - cy) * (y - cy) > R * R || !isSkinAt(img, x, y)) continue;
      pts.push(x, y); mx += x; my += y; n++;
    }
  if (n < 30) return null;
  mx /= n; my /= n;
  let sxx = 0, sxy = 0, syy = 0;
  for (let k = 0; k < pts.length; k += 2) { const dx = pts[k] - mx, dy = pts[k + 1] - my; sxx += dx * dx; sxy += dx * dy; syy += dy * dy; }
  const th = 0.5 * Math.atan2(2 * sxy, sxx - syy);              // asse principale, in coordinate dell'immagine ridotta
  let dx = Math.cos(th), dy = Math.sin(th);
  const el = Math.sqrt(Math.max(0, (sxx + syy) / 2 + Math.hypot((sxx - syy) / 2, sxy))), es = Math.sqrt(Math.max(0, (sxx + syy) / 2 - Math.hypot((sxx - syy) / 2, sxy)));
  if (facing === 'user') dx = -dx;                              // in coordinate schermo
  if (dy > 0 || (Math.abs(dy) < 1e-3 && dx < 0)) { dx = -dx; dy = -dy; }   // la mano e' verso l'alto della sagoma
  return { a: Math.atan2(dx, -dy), cx: mx, cy: my, elong: es > 0 ? el / es : 1 };
}
function finishMapping(img) {
  const g = guideGeom(), ls = lowPerScreen();
  skin = buildModel(calib.last);
  adj.dx = 0; adj.dy = 0; adj.ds = 1; adj.da = 0; flipped = 0;
  base.x = g.cx; base.y = g.wristY; base.a = 0; base.w = g.gw * 0.62;
  const c = screenToLow(g.cx, g.wristY), ax = armAxis(img, c.x, c.y, g.gw * 0.9 * ls);
  if (ax && ax.elong > 1.25 && Math.abs(ax.a) < 1.3) {         // braccio riconosciuto: orologio nella sua direzione
    base.a = ax.a;
    const mc = lowToScreen(ax.cx, ax.cy), u = { x: Math.sin(ax.a), y: -Math.cos(ax.a) };
    const t = (g.cx - mc.x) * u.x + (g.wristY - mc.y) * u.y;       // il polso della sagoma, proiettato sull'asse
    base.x = mc.x + u.x * t; base.y = mc.y + u.y * t;
  }
  const s = crossSection(img, base.x, base.y, base.a);
  if (s && s.l + s.r > 10) {
    const off = (s.r - s.l) / 2;
    base.x += off * Math.cos(base.a); base.y += off * Math.sin(base.a);
    base.w = (s.l + s.r) * 0.66;
    armHalf = Math.max(0.66, Math.min(1.0, (s.l + s.r) / 2 / base.w));
  } else armHalf = 0.78;
  applyMask();
  clampBase(); smooth.x = null; render();
  enterTracking(img);
  say(`Polso mappato. Muovi il braccio per provare l'orologio. Se è girato al contrario, tocca "Gira".`);
}

/* ================= ciclo principale ================= */
function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  if (video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const now = performance.now();
  let hand = null;
  if (landmarker) { try { const res = landmarker.detectForVideo(video, now); if (res && res.landmarks && res.landmarks.length) hand = res.landmarks[0]; } catch (e) {} }
  const img = grabFrame(); if (!img) return;
  if (checkBlack(img)) return;                       // finche' l'immagine e' nera non si analizza nulla

  const track = hooked && mode === 'tracking';
  if (track) { pyr = LK.buildPyr(img.g, img.w, img.h); if (hand || frozen) { tracker.feed(pyr); tracker.reset(); } }
  if (hand) {
    lastSeen = now;
    if (!hooked) {                                   // mano riconosciuta: mappatura automatica, senza sagoma
      const p = poseFromHand(hand), c = screenToLow(p.x, p.y), h = Math.max(3, p.w * lowPerScreen() * 0.22);
      const st = regionStats(img, c.x - h, c.y - h, c.x + h, c.y + h);
      skin = (plausible(st) ? buildModel(st) : null);
      armHalf = 0.78; applyMask(); smooth.x = null; applyPose(p); render(); enterTracking(img);
    }
    if (!handVisible) { handVisible = true; say(`Mano riconosciuta. Se la allontani, l'orologio resta sul polso.`); }
    if (!frozen) { applyPose(poseFromHand(hand)); render(); }
  } else if (mode === 'guide') {
    stepCalibration(img);
  } else if (hooked) {
    if (handVisible && now - lastSeen > 400) { handVisible = false; say(frozen ? `Orologio fissato` : `Mano fuori: l'orologio segue il polso. "Fissa" lo blocca.`); }
    if (!handVisible && !frozen) { if (tracker.prev) trackWrist(img); else tracker.feed(pyr); }
  }
  if (debugOn) drawDebug(img);
}

/* ================= vista di controllo: mostra la pelle riconosciuta ================= */
function drawDebug(img) {
  if (!skin) { dbgCanvas.style.display = 'none'; return; }
  const m = metrics();
  if (dbgCanvas.width !== img.w || dbgCanvas.height !== img.h) { dbgCanvas.width = img.w; dbgCanvas.height = img.h; }
  const ctx = dbgCanvas.getContext('2d'), id = ctx.createImageData(img.w, img.h), d = id.data;
  for (let y = 0; y < img.h; y++) for (let x = 0; x < img.w; x++) if (isSkinAt(img, x, y)) { const j = (y * img.w + x) * 4; d[j + 1] = 255; d[j + 3] = 255; }
  ctx.putImageData(id, 0, 0);
  const s = dbgCanvas.style;
  s.display = 'block'; s.left = m.ox + 'px'; s.top = m.oy + 'px'; s.width = m.vw * m.k + 'px'; s.height = m.vh * m.k + 'px';
  s.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
}

/* ================= fotocamera e modello della mano ================= */
/* Avvio della fotocamera, a prova di richieste doppie (succede su iPhone quando si apre la pagina dal QR):
   ogni avvio ha un numero; se nel frattempo ne parte un altro, quello vecchio si ferma e rilascia la fotocamera. */
let camToken = 0, starting = false, blackFrames = 0, blackRetries = 0, goodFrames = 0;
const CONSTRAINTS = [   // dalle impostazioni piu' complete alle piu' semplici (alcuni telefoni mostrano nero con la risoluzione richiesta)
  f => ({ video: { facingMode: { ideal: f }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }),
  f => ({ video: { facingMode: { ideal: f } }, audio: false }),
  () => ({ video: true, audio: false })
];
function showStart(text, btn) {
  $('startText').textContent = text; $('startBtn').textContent = btn || 'Riprova'; $('startBtn').style.display = '';
  $('start').style.display = 'flex';
}
async function startCamera(level = 0) {
  const my = ++camToken;
  starting = true;
  stopCamera();
  $('start').style.display = 'none';
  let s;
  try { s = await navigator.mediaDevices.getUserMedia(CONSTRAINTS[Math.min(level, CONSTRAINTS.length - 1)](facing)); }
  catch (e) {
    if (my !== camToken) return;
    starting = false;
    const n = e && e.name;
    showStart(n === 'NotAllowedError' || n === 'SecurityError'
      ? `La fotocamera è bloccata. Consenti l'accesso a questo sito (su iPhone: Impostazioni > Safari > Fotocamera > Consenti) e riprova.`
      : n === 'NotReadableError' || n === 'AbortError'
      ? `La fotocamera è occupata da un'altra app. Chiudi le altre app che la usano e riprova.`
      : `Non riesco ad accedere alla fotocamera (${n || 'errore'}). Riprova.`);
    return;
  }
  if (my !== camToken) { s.getTracks().forEach(t => t.stop()); return; }      // e' partita un'altra richiesta: questa si ritira
  stream = s;
  video.srcObject = s;
  video.muted = true; video.setAttribute('playsinline', ''); video.setAttribute('webkit-playsinline', '');
  video.classList.toggle('mirror', facing === 'user');
  try { await video.play(); }
  catch (e) { if (my === camToken) { starting = false; showStart(`Tocca per avviare la fotocamera.`, 'Avvia'); } return; }
  if (my !== camToken) return;
  starting = false;
  lastVideoTime = -1; blackFrames = 0; goodFrames = 0; blackLevel = level;
  startMapping();
  if (!running) { running = true; requestAnimationFrame(loop); }
}
let blackLevel = 0;
function stopCamera() { running = false; if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

/* se la fotocamera e' aperta ma mostra solo nero, riprova con impostazioni piu' semplici */
function checkBlack(img) {
  let sum = 0, n = 0;
  for (let i = 0; i < img.g.length; i += 37) { sum += img.g[i]; n++; }
  const mean = sum / n;
  if (mean > 6) { goodFrames++; blackFrames = 0; return false; }
  if (++blackFrames < 50) return true;                       // circa 1,5 secondi di nero
  blackFrames = 0;
  if (goodFrames === 0 && blackRetries < CONSTRAINTS.length - 1) {
    blackRetries++;
    say(`La fotocamera mostra solo nero: riprovo con altre impostazioni…`, true);
    startCamera(blackLevel + 1);
  } else if (goodFrames === 0) {
    blackRetries = 0;
    stopCamera();
    showStart(`La fotocamera risulta aperta ma l'immagine resta nera. Chiudi le altre schede e app che usano la fotocamera, controlla che l'obiettivo non sia coperto e riprova. Se la batteria è quasi scarica, ricarica il telefono.`);
  }
  return true;
}

async function loadModel() {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
  const opts = delegate => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 1, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
  });
  try { landmarker = await HandLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch (e) { landmarker = await HandLandmarker.createFromOptions(fileset, opts("CPU")); }
}

/* ================= gesti: 1 dito sposta, 2 dita ingrandiscono e ruotano ================= */
const touches = new Map(); let gst = null;
const pts = () => [...touches.values()];
function startGesture() {
  const p = pts();
  if (p.length === 1) gst = { m: 'move', x: p[0].x, y: p[0].y, dx: adj.dx, dy: adj.dy };
  else if (p.length >= 2) gst = { m: 'pinch', d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), r: Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x), ds: adj.ds, da: adj.da };
  else gst = null;
}
stage.addEventListener('pointerdown', e => { touches.set(e.pointerId, { x: e.clientX, y: e.clientY }); stage.setPointerCapture(e.pointerId); startGesture(); });
stage.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId) || mode !== 'tracking') return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const p = pts();
  if (gst && gst.m === 'move' && p.length === 1) {
    const sx = p[0].x - gst.x, sy = p[0].y - gst.y, c = Math.cos(-base.a), s = Math.sin(-base.a);
    adj.dx = gst.dx + (sx * c - sy * s) / base.w; adj.dy = gst.dy + (sx * s + sy * c) / base.w;
  } else if (gst && gst.m === 'pinch' && p.length >= 2) {
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), r = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x);
    adj.ds = Math.min(3, Math.max(0.3, gst.ds * d / gst.d)); adj.da = gst.da + (r - gst.r);
  }
  render();
});
const up = e => { touches.delete(e.pointerId); startGesture(); };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
document.addEventListener('gesturestart', e => e.preventDefault());

$('reset').addEventListener('click', () => { adj.dx = 0; adj.dy = 0; adj.ds = 1; adj.da = 0; render(); say('Posizione ripristinata'); });
$('turn').addEventListener('click', () => { flipped = flipped ? 0 : 1; render(); say('Orologio girato di 180°'); });
$('remap').addEventListener('click', () => startMapping());
$('freeze').addEventListener('click', () => {
  frozen = !frozen; $('freeze').textContent = frozen ? 'Sblocca' : 'Fissa';
  say(frozen ? `Orologio fissato: non si muove più da solo` : `L'orologio torna a seguire il polso`);
});
$('dbgBtn').addEventListener('click', () => {
  debugOn = !debugOn; $('dbgBtn').classList.toggle('on', debugOn);
  if (!debugOn) dbgCanvas.style.display = 'none';
  say(debugOn ? `In verde la pelle riconosciuta: se non copre il polso, cambia luce o sfondo` : `Vista di controllo spenta`);
});
$('flip').addEventListener('click', () => { facing = facing === 'environment' ? 'user' : 'environment'; blackRetries = 0; startCamera(0); });
$('startBtn').addEventListener('click', () => { blackRetries = 0; startCamera(0); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { camToken++; starting = false; stopCamera(); }          // annulla anche gli avvii in corso
  else if (!stream && !starting && $('start').style.display !== 'flex') startCamera();   // riparte solo se serve davvero
});
addEventListener('pagehide', stopCamera);
addEventListener('resize', () => { if (mode === 'guide') drawGuide(); else render(); });

/* solo per i test */
window.__t = { base, adj, tilt, render, screenToLow, lowToScreen, lowPerScreen, regionStats, buildModel, plausible, crossSection, armAxis, finishMapping, tracker,
  poseFromHand, applyPose, grabFrame, isSkinAt,
  stepCalibration, trackWrist, startCamera, checkBlack, getStream: () => stream, getToken: () => camToken, setSkin: m => { skin = m; }, getSkin: () => skin, setFacing: f => { facing = f; }, get mode() { return mode; } };

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  $('startText').textContent = 'Questo browser non permette di usare la fotocamera. Apri il link con Safari (iPhone) o Chrome (Android).';
  $('startBtn').style.display = 'none'; $('start').style.display = 'flex';
} else {
  startCamera();
  loadModel().catch(() => {});   // senza il riconoscimento della mano la mappatura guidata funziona comunque
}
</script>
